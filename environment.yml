channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # R runtime only. renv owns every R package.
  - r-base=4.5
  # build toolchain for renv source installs
  - compilers
  - make
  - cmake           # packages that build a bundled library (e.g. nloptr)
  - pkg-config
  # C libraries commonly needed by R packages
  - libcurl
  - openssl
  - libxml2-devel   # libxml2 + xml2-config / libxml-2.0.pc (igraph, xml2); without it builds use a libxml2 from PATH
  - zlib
  - icu
  - libuv           # fs (used by most of the tidyverse, devtools, renv tooling)
  - zeromq          # IRkernel -> pbdZMQ
  - gettext
  - pandoc          # rmarkdown
  # C libraries the single-cell R packages compile against
  - hdf5            # hdf5r
  - gsl             # DirichletMultinomial (TFBSTools)
  - glpk            # igraph
  - fftw            # qqconf (metap)
  - gdal            # sf (spdep)
  - geos
  - proj
  - udunits2        # units (sf)
  - imagemagick     # magick
  - cairo           # Cairo
  - fontconfig
  - libgit2         # gert (devtools)
  - bzip2           # Rhtslib (Rsamtools, BSgenome)
  - xz
  - zstd
  - libnetcdf
  # Jupyter front end (kernels come from uv and renv)
  - jupyterlab
  - jupyterlab-lsp
  # Reports (rendered by targets via tar_quarto)
  - quarto>=1.9
  # CLI tools
  - shellcheck
  # Genomics tools (bioconda)
  - samtools
  - bwa
  # fonts and images: systemfonts, textshaping, ragg (pulled in by devtools/pkgdown, ggplot2 extensions)
  - freetype        # headers + freetype2.pc (./env has only the runtime libfreetype)
  - harfbuzz        # textshaping
  - fribidi         # textshaping
  - libpng          # ragg
  - libjpeg-turbo   # ragg
  - libtiff         # ragg
  - libwebp         # ragg
  - expat